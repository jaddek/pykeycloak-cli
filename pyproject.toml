[project]
name = "pykeycloak-cli"
version = "0.1.0"
description = "Keyclock CLI"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "MIT"}
authors = [
    {name = "Anton 'Tony' Nazarov", email = "tonynazarov+dev@gmail.com"},
]
maintainers = [
    {name = "Anton 'Tony' Nazarov", email = "tonynazarov+dev@gmail.com"},
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
keywords = ["cli", "keycloak", "helpers"]

dependencies = [
    "pykeycloak>=0.8.0",
    "typer>=0.21.1",
]

[project.scripts]
pykc = "pykeycloak_cli.app:app"

[tool.uv.sources]
pykeycloak = { git = "https://github.com/jaddek/pykeycloak.git"}

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "UP",    # pyupgrade
    "ASYNC", # flake8-async
    "S",     # flake8-bandit
    "PYI",   # flake8-pyi
]
ignore = [
    "E501", # Line length (delegated to Black / Ruff Format)
    "B008", # Function calls in argument defaults (convenient for FastAPI-style DI)
    "B010",
    "B009",
    "PYI013", # Allow setattr in stub files (needed for decorators)
    "UP037", # Quoted annotations (useful for circular imports)
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
asyncio_mode = "auto"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  {include-group = "lint"},
  {include-group = "test"},
]
lint = [
    "black>=25.1.0",
    "ruff>=0.9.0",
    "ty>=0.0.1a13",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
]
